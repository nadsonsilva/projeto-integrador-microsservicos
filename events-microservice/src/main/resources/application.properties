spring.application.name=events-microservice
server.port=8080

# H2 em memória (dados reiniciam ao parar o projeto)
spring.datasource.url=jdbc:h2:mem:eventosdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Comunicação com o segundo serviço, via Feign
email.service.url=${EMAIL_SERVICE_URL:http://localhost:8090}
